name = "small-model"
description = "Simplifies output schema for small / local LLMs"
instructions = [
  "Keep queries simple: max 2 joins, no subqueries in WHERE.",
  "Always use table aliases (first letter of table name).",
  "Prefer LEFT JOIN over NOT IN / NOT EXISTS.",
  "GROUP BY must include every non-aggregated column in SELECT.",
  "Use count(DISTINCT col) syntax, NOT count_distinct(col) function.",
  "Window functions (row_number, rank, lag) MUST include OVER clause.",
  "For EXTRACT(field FROM col), field must be a literal like 'month', never a parameter.",
]
simplify_schema = true
forbid_features = ["set_operation", "window_functions", "distinct_on"]
disable_output_fields = ["set_operation", "ctes", "distinct_on"]

[[examples]]
question = "Show user names"
plan = { select = [{ type = "column_ref", table = "users", column = "name", alias = null }], from = { table = "users", alias = null } }

[[examples]]
question = "Recursive org chart from manager name"
plan.ctes = [
  { name = "org_tree", recursive = true, query = {
    select = [{ type = "column_ref", table = "employees", column = "id" }, { type = "column_ref", table = "employees", column = "name" }, { type = "column_ref", table = "employees", column = "manager_id" }],
    from = { table = "employees" },
    where = { type = "comparison", left = { type = "column_ref", column = "name" }, op = "eq", right = { type = "literal", value = "赵总", data_type = "string" } }
  } },
  { name = "org_tree", recursive = true, query = {
    select = [{ type = "column_ref", table = "org_tree", column = "id" }, { type = "column_ref", table = "org_tree", column = "name" }, { type = "column_ref", table = "employees", column = "manager_id" }],
    from = { table = "org_tree" },
    joins = [{ join_type = "inner", right_table = { table = "employees" }, on = { type = "comparison", left = { type = "column_ref", table = "org_tree", column = "id" }, op = "eq", right = { type = "column_ref", table = "employees", column = "manager_id" } } }]
  } }
plan.select = [{ type = "column_ref", column = "id" }, { type = "column_ref", column = "name" }]
plan.from = { table = "org_tree" }
