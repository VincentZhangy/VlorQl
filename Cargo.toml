[workspace]
members = [
    "crates/vlorql-core",
    "crates/vlorql-llm",
    "crates/vlorql-cli",
    "crates/vlorql",
]
resolver = "2"

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "VlorQl — natural language to SQL query engine"
documentation = "https://docs.rs/vlorql"
homepage = "https://github.com/VincentZhangy/VlorQl"
repository = "https://github.com/VincentZhangy/VlorQl"
readme = "README.md"
keywords = ["sql", "nlp", "query", "llm", "database"]
categories = ["database", "compilers", "natural-language"]

[workspace.lints.clippy]
correctness = "deny"
suspicious = "warn"
perf = "warn"
complexity = "warn"
# pedantic is intentionally allow — enable individual rules as needed.
pedantic = "allow"

[workspace.metadata.husky.hooks]
pre-commit = "cargo fmt --all -- --check && cargo clippy --workspace --all-targets -- -D warnings"

[workspace.dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "registry"] }
derive_builder = "0.12"
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.0"
toml = "0.8"
serde_yaml = "0.9"
mockall = "0.12"
rstest = "0.18"
mockito = "1.7"
clap = { version = "4.0", features = ["derive", "env"] }
futures = "0.3"
tokio-stream = "0.1"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.0"
criterion = { version = "0.5", features = ["html_reports"] }
bincode = "1"

# OpenTelemetry
opentelemetry = { version = "0.28", features = ["metrics", "trace"] }
opentelemetry_sdk = { version = "0.28", features = ["metrics", "rt-tokio", "testing"] }
opentelemetry-otlp = { version = "0.28", features = ["metrics", "trace", "grpc-tonic"] }
tracing-opentelemetry = "0.29"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 3
