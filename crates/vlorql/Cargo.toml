[package]
name = "vlorql"
version.workspace = true
edition.workspace = true
license.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
description = "High-level SQL query optimization and LLM-powered natural language querying library"

[lints]
workspace = true

[package.metadata.husky.hooks]
pre-commit = "cargo fmt --all -- --check && cargo clippy --workspace --all-targets -- -D warnings"

[features]
default = ["executor-postgres", "executor-mysql", "executor-sqlite"]
executor-postgres = ["tokio-postgres", "tokio-postgres-rustls", "async-trait"]
executor-mysql = ["sqlx", "sqlx/mysql", "sqlx/runtime-tokio"]
executor-sqlite = ["sqlx", "sqlx/sqlite", "sqlx/runtime-tokio"]
vector-search = ["vlorql-core/vector-search"]

[dependencies]
vlorql-core = { path = "../vlorql-core", version = "0.5.0" }
vlorql-llm = { path = "../vlorql-llm", version = "0.5.0" }
tracing.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
tokio-stream.workspace = true
opentelemetry.workspace = true
async-trait = { workspace = true, optional = true }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"], optional = true }
tokio-postgres-rustls = { version = "0.12", optional = true }
sqlx = { version = "0.8", optional = true, features = ["runtime-tokio"] }

[dev-dependencies]
cargo-husky = "1"
anyhow.workspace = true
async-trait.workspace = true
rstest.workspace = true
futures.workspace = true
tracing-subscriber.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
tokio-postgres-rustls = "0.12"
rustls = "0.23"
webpki-roots = "0.26"
bytes.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "security_sql_injection"
path = "tests/security/sql_injection.rs"

[[test]]
name = "security_policy_bypass"
path = "tests/security/policy_bypass.rs"

[[test]]
name = "security_dialect_bypass"
path = "tests/security/dialect_bypass.rs"

[[test]]
name = "security_malformed_json"
path = "tests/security/malformed_json.rs"
